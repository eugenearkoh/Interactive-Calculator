<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#101411">

  <meta name="description" content="A responsive interactive calculator built for the Pynexia Technology Internship.">

  <title>Interactive Calculator</title>

  <link rel="stylesheet" href="style.css">

</head>

<body>

  <main class="calculator">

    <header class="calculator-header">

      <div>

        <p class="eyebrow">PYNEXIA TECHNOLOGY</p>

        <h1>Calculator<span>.</span></h1>

      </div>

      <span class="status">ONLINE</span>

    </header>

    <section class="display" aria-label="Calculator display">

      <div id="expression" class="expression" aria-live="polite"></div>

      <output id="result" class="result" aria-live="polite">0</output>

    </section>

    <section class="keypad" aria-label="Calculator keys">

      <button class="key utility" data-action="clear">AC</button>

      <button class="key utility" data-action="delete" aria-label="Delete last character">⌫</button>

      <button class="key operator" data-action="operator" data-value="/">÷</button>

      <button class="key operator" data-action="operator" data-value="*">×</button>

      <button class="key" data-action="number" data-value="7">7</button>

      <button class="key" data-action="number" data-value="8">8</button>

      <button class="key" data-action="number" data-value="9">9</button>

      <button class="key operator" data-action="operator" data-value="-">−</button>

      <button class="key" data-action="number" data-value="4">4</button>

      <button class="key" data-action="number" data-value="5">5</button>

      <button class="key" data-action="number" data-value="6">6</button>

      <button class="key operator" data-action="operator" data-value="+">+</button>

      <button class="key" data-action="number" data-value="1">1</button>

      <button class="key" data-action="number" data-value="2">2</button>

      <button class="key" data-action="number" data-value="3">3</button>

      <button class="key equals" data-action="calculate" rowspan="2">=</button>

      <button class="key zero" data-action="number" data-value="0">0</button>

      <button class="key" data-action="decimal">.</button>

    </section>

    <footer class="calculator-footer">

      <span>Simple. Precise. Fast.</span>

      <span>WEEK 1 · ASSIGNMENT 2</span>

    </footer>

  </main>

  <script src="script.js"></script>

</body>

</html>
